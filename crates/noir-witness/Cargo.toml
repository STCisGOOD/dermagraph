[package]
name = "noir-witness"
version = "0.1.0"
edition = "2021"
description = "Witness generator for Spectral Turing Hash Noir circuits"
license = "MIT"

[dependencies]
# Internal dependencies
# NOTE: We disable default features to avoid the contrastive/burn dependency
# which has compilation issues. The core types (BiometricData, MinutiaeSet)
# are available without the contrastive feature.
biometric-extract = { path = "../biometric-extract", default-features = false }
turing-core = { path = "../turing-core" }

# Field arithmetic
ark-ff.workspace = true
ark-bn254.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true

# Hashing (for nullifiers, merkle)
sha2.workspace = true

# Hex encoding
hex = "0.4"

# RNG for commitment blinding
rand = "0.8"

[[bin]]
name = "gen_person_witness"
path = "src/bin/gen_person_witness.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
