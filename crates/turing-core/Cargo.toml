[package]
name = "turing-core"
description = "Cryptographic primitive derived from Turing reaction-diffusion dynamics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ark-ff = { workspace = true }
ark-bn254 = { workspace = true }
ark-std = { workspace = true }
nalgebra = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = "0.8"
hex = "0.4"
# Real Poseidon hash - circomlib compatible (matches Noir)
light-poseidon = "0.4"
# Key derivation (for sovereign wallet)
sha2 = { workspace = true }
sha3 = "0.10"
argon2 = { workspace = true }
hkdf = { workspace = true }
# Ethereum-compatible signing (for sovereign wallet)
k256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
# Ed25519 signing
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# Base58 encoding (for Solana addresses)
bs58 = "0.5"

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "turing_bench"
harness = false
