<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" fill="none">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4E02;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="380" fill="#0a0a0a" rx="8"/>

  <!-- turing-core (top) -->
  <rect x="50" y="20" width="160" height="45" rx="6" fill="#1a1a1a" stroke="url(#orangeGrad)" stroke-width="2"/>
  <text x="130" y="48" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">turing-core</text>

  <!-- Arrow down from turing-core -->
  <path d="M130 65 L130 95" stroke="#EC4E02" stroke-width="2"/>
  <polygon points="130,105 125,95 135,95" fill="#EC4E02"/>

  <!-- biometric-extract -->
  <rect x="50" y="110" width="160" height="45" rx="6" fill="#1a1a1a" stroke="#EC4E02" stroke-width="2"/>
  <text x="130" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">biometric-extract</text>

  <!-- Arrow down from biometric-extract -->
  <path d="M130 155 L130 185" stroke="#EC4E02" stroke-width="2"/>
  <polygon points="130,195 125,185 135,195" fill="#EC4E02"/>

  <!-- noir-witness -->
  <rect x="50" y="200" width="160" height="45" rx="6" fill="#1a1a1a" stroke="#EC4E02" stroke-width="2"/>
  <text x="130" y="228" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">noir-witness</text>

  <!-- Arrow down from noir-witness -->
  <path d="M130 245 L130 275" stroke="#EC4E02" stroke-width="2"/>
  <polygon points="130,285 125,275 135,275" fill="#EC4E02"/>

  <!-- dermagraphd -->
  <rect x="50" y="290" width="160" height="45" rx="6" fill="#1a1a1a" stroke="url(#orangeGrad)" stroke-width="2"/>
  <text x="130" y="318" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">dermagraphd</text>

  <!-- hardware -->
  <rect x="280" y="290" width="170" height="45" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="365" y="310" text-anchor="middle" fill="#888" font-family="monospace" font-size="11" font-weight="bold">hardware</text>
  <text x="365" y="326" text-anchor="middle" fill="#666" font-family="monospace" font-size="9">(R503 driver)</text>

  <!-- Arrow from dermagraphd to hardware -->
  <path d="M210 312 L270 312" stroke="#555" stroke-width="2"/>
  <polygon points="280,312 270,307 270,317" fill="#555"/>

  <!-- Curved arrow: dermagraphd back to turing-core -->
  <path d="M210 300 Q 350 300 350 42 Q 350 42 220 42" stroke="#EC4E02" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <polygon points="210,42 220,37 220,47" fill="#EC4E02"/>

  <!-- Curved arrow: dermagraphd back to biometric-extract -->
  <path d="M210 310 Q 300 310 300 132 Q 300 132 220 132" stroke="#EC4E02" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <polygon points="210,132 220,127 220,137" fill="#EC4E02"/>

  <!-- Curved arrow: noir-witness back to biometric-extract -->
  <path d="M210 222 Q 260 222 260 132 Q 260 132 220 132" stroke="#888" stroke-width="1.5" fill="none"/>
  <polygon points="210,132 218,128 218,136" fill="#888"/>

</svg>