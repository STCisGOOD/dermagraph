<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" fill="none">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4E02;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9945FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14F195;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="120" fill="#0a0a0a" rx="8"/>

  <!-- Box 1: Fingerprint -->
  <rect x="20" y="20" width="180" height="60" rx="6" fill="#1a1a1a" stroke="#EC4E02" stroke-width="2"/>
  <text x="110" y="45" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">Fingerprint</text>
  <text x="110" y="62" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">(on device)</text>
  <text x="110" y="100" text-anchor="middle" fill="#EC4E02" font-family="monospace" font-size="11" font-weight="bold">PRIVATE</text>

  <!-- Arrow 1 -->
  <path d="M200 50 L240 50" stroke="#EC4E02" stroke-width="2"/>
  <polygon points="250,50 240,45 240,55" fill="#EC4E02"/>

  <!-- Box 2: ZK Proof -->
  <rect x="260" y="20" width="180" height="60" rx="6" fill="#1a1a1a" stroke="url(#orangeGrad)" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">ZK Proof</text>
  <text x="350" y="62" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">(Noir/Groth16)</text>
  <text x="350" y="100" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">324 bytes</text>

  <!-- Arrow 2 -->
  <path d="M440 50 L480 50" stroke="url(#purpleGrad)" stroke-width="2"/>
  <polygon points="490,50 480,45 480,55" fill="#14F195"/>

  <!-- Box 3: Solana -->
  <rect x="500" y="20" width="180" height="60" rx="6" fill="#1a1a1a" stroke="url(#purpleGrad)" stroke-width="2"/>
  <text x="590" y="45" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">Solana</text>
  <text x="590" y="62" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">(on-chain)</text>
  <text x="590" y="100" text-anchor="middle" fill="#14F195" font-family="monospace" font-size="11" font-weight="bold">VERIFIED</text>
</svg>