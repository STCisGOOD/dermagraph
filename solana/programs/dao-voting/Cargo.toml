[package]
name = "dao-voting"
version = "0.1.0"
description = "Sybil-resistant DAO voting with biometric ZK proofs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dao_voting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.29.0"
